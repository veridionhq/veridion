name: hosted-app-smoke

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - ".github/workflows/hosted-app-smoke.yml"
      - "src/veridion/action/runner.py"
      - "src/veridion/action/decision_history_service.py"
      - "src/veridion/action/decision_history_store.py"
      - "tests/integration/test_action_runner.py"
      - "tests/unit/test_decision_history_service.py"
  push:
    branches:
      - develop
      - main
    paths:
      - ".github/workflows/hosted-app-smoke.yml"
      - "src/veridion/action/runner.py"
      - "src/veridion/action/decision_history_service.py"
      - "src/veridion/action/decision_history_store.py"
      - "tests/integration/test_action_runner.py"
      - "tests/unit/test_decision_history_service.py"

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e .[dev]

      - name: Run hosted control-plane smoke
        run: python3 -m pytest tests/unit/test_decision_history_service.py tests/integration/test_action_runner.py -q

      - name: Build hosted smoke artifact
        run: |
          mkdir -p smoke-artifacts
          python3 - <<'PY'
          import json
          from pathlib import Path
          from veridion.action.runner import run_action

          diff_text = Path("tests/fixtures/diffs/sample_pr.diff").read_text()
          result = run_action(
              diff_text=diff_text,
              current_reports={
                  "trivy": "tests/fixtures/scanners/trivy_report.json",
                  "semgrep": "tests/fixtures/scanners/semgrep_report.json",
                  "grype": "tests/fixtures/scanners/grype_report.json",
                  "syft": "tests/fixtures/scanners/syft_report.json",
              },
              baseline_reports={
                  "semgrep": "tests/fixtures/scanners/semgrep_report.json",
              },
              policy_text=Path("tests/fixtures/policies/default_policy.yaml").read_text(),
              metadata_text=Path("tests/fixtures/pr/pr_metadata.json").read_text(),
              trust_profile_text=Path("tests/fixtures/pr/trust_profile.json").read_text(),
          )
          payload = result.to_dict()
          assert payload["report_diagnostics"]["attribution_trusted"] is True
          assert payload["report_diagnostics"]["attribution_mode"] == "trusted"
          Path("smoke-artifacts/veridion-result.json").write_text(json.dumps(payload, indent=2) + "\n")
          Path("smoke-artifacts/veridion-comment.md").write_text(result.comment_markdown)
          suspicious = run_action(
              diff_text="\n".join(
                  [
                      *(
                          line
                          for index in range(30)
                          for line in (
                              f"diff --git a/app/file_{index}.py b/app/file_{index}.py",
                              f"--- a/app/file_{index}.py",
                              f"+++ b/app/file_{index}.py",
                              "@@ -1 +1 @@",
                              "-pass",
                              "+print('changed')",
                          )
                      ),
                      "diff --git a/app/routes.py b/app/routes.py",
                      "--- a/app/routes.py",
                      "+++ b/app/routes.py",
                      "@@ -1 +1 @@",
                      "-pass",
                      "+danger()",
                  ]
              ),
              current_reports={
                  "semgrep": "tests/fixtures/scanners/semgrep_report.json",
              },
              baseline_reports={
                  "semgrep": "tests/fixtures/scanners/semgrep_baseline_empty.json",
              },
              policy_text=None,
          )
          suspicious_payload = suspicious.to_dict()
          assert suspicious_payload["report_diagnostics"]["attribution_trusted"] is False
          assert suspicious_payload["report_diagnostics"]["attribution_mode"] == "missing_baseline"
          assert suspicious_payload["report_diagnostics"]["zero_finding_baseline_tools"] == ["semgrep"]
          assert "### Report Health" in suspicious.comment_markdown
          Path("smoke-artifacts/veridion-result-suspicious.json").write_text(json.dumps(suspicious_payload, indent=2) + "\n")
          Path("smoke-artifacts/veridion-comment-suspicious.md").write_text(suspicious.comment_markdown)
          PY

      - name: Upload hosted smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hosted-app-smoke-artifacts
          path: smoke-artifacts/
