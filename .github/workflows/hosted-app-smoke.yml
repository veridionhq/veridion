name: hosted-app-smoke

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - ".github/workflows/hosted-app-smoke.yml"
      - "src/veridion/action/decision_history_service.py"
      - "src/veridion/action/decision_history_store.py"
      - "tests/unit/test_decision_history_service.py"
  push:
    branches:
      - develop
      - main
    paths:
      - ".github/workflows/hosted-app-smoke.yml"
      - "src/veridion/action/decision_history_service.py"
      - "src/veridion/action/decision_history_store.py"
      - "tests/unit/test_decision_history_service.py"

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e .[dev]

      - name: Run hosted control-plane smoke
        run: python3 -m pytest tests/unit/test_decision_history_service.py -q
