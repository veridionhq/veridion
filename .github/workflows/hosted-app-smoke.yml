name: hosted-app-smoke

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e .[dev]

      - name: Run hosted control-plane expansion smoke
        run: python3 -m pytest tests/unit/test_decision_history_service.py tests/integration/test_action_runner.py -q

      - name: Build hosted smoke artifact
        run: |
          mkdir -p smoke-artifacts
          python3 - <<'PY'
          import json
          from pathlib import Path
          from veridion.action.runner import run_action

          diff_text = Path("tests/fixtures/diffs/sample_pr.diff").read_text()
          result = run_action(
              diff_text=diff_text,
              current_reports={
                  "trivy": "tests/fixtures/scanners/trivy_report.json",
                  "grype": "tests/fixtures/scanners/grype_report.json",
                  "syft": "tests/fixtures/scanners/syft_report.json",
              },
              baseline_reports={
                  "trivy": "tests/fixtures/scanners/trivy_report.json",
                  "grype": "tests/fixtures/scanners/grype_report.json",
                  "syft": "tests/fixtures/scanners/syft_report.json",
              },
              policy_text=Path("examples/policy-packs/dependency-risk-v1.yaml").read_text(),
              metadata_text=Path("tests/fixtures/pr/pr_metadata.json").read_text(),
              trust_profile_text=Path("tests/fixtures/pr/trust_profile.json").read_text(),
          )
          payload = result.to_dict()
          assert payload["report_diagnostics"]["attribution_trusted"] is True
          assert payload["report_diagnostics"]["attribution_mode"] == "trusted"
          Path("smoke-artifacts/veridion-result.json").write_text(json.dumps(payload, indent=2) + "\n")
          Path("smoke-artifacts/veridion-comment.md").write_text(result.comment_markdown)
          PY

      - name: Upload hosted smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hosted-app-smoke-artifacts
          path: smoke-artifacts/
