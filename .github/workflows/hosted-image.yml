name: hosted-image-expansion

on:
  workflow_dispatch:
    inputs:
      push_to_ecr:
        description: "Push the built image to ECR for hosted-control-plane experiments"
        required: false
        default: false
        type: boolean
      image_tag:
        description: "Image tag to publish when pushing to ECR"
        required: false
        default: "manual"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
      ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
      AWS_GITHUB_ACTIONS_ROLE_ARN: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN != '' && vars.AWS_GITHUB_ACTIONS_ROLE_ARN || secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      SHA_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build hosted image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: veridion-hosted:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate ECR publish configuration
        if: ${{ inputs.push_to_ecr }}
        shell: bash
        run: |
          [[ -n "${ECR_REPOSITORY_URL}" ]] || { echo "ECR_REPOSITORY_URL repo variable is required"; exit 1; }
          [[ -n "${AWS_GITHUB_ACTIONS_ROLE_ARN}" ]] || { echo "AWS_GITHUB_ACTIONS_ROLE_ARN repo variable or secret is required"; exit 1; }

      - name: Configure AWS credentials
        if: ${{ inputs.push_to_ecr }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_GITHUB_ACTIONS_ROLE_ARN }}

      - name: Log in to ECR
        if: ${{ inputs.push_to_ecr }}
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push hosted image to ECR
        if: ${{ inputs.push_to_ecr }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REPOSITORY_URL }}:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REPOSITORY_URL }}:${{ env.SHA_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
